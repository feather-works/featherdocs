[package]
name = "featherdocs-pelicano"
version = "0.1.2"
edition = "2021"
description = "Interface nativa do FeatherDocs no pelicano, ao lado da versão Iced para comparar"

[[bin]]
name = "featherdocs-pelicano"
path = "src/main.rs"

[dependencies]
# Os dois por tag e casados: o feather-ui v0.3.8 depende do pelicano v0.1.19 (outra versão duplica os tipos).
pelicano = { git = "https://github.com/feather-works/pelicano.git", tag = "v0.1.19", features = ["highlighter"] }
feather-ui = { git = "https://github.com/feather-works/feather-ui.git", tag = "v0.3.8" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.3" }
feather-image = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.3" }
featherdocs-tabelas = { path = "../featherdocs-tabelas" }
featherdocs-core = { path = "../featherdocs-core" }
featherdocs-io = { path = "../featherdocs-io" }
# As versões dentro do .fdoz (o Git embutido): salvar acrescenta uma, sem apagar as antigas.
featherdocs-historico = { path = "../featherdocs-historico" }
# Desenha os glifos das fórmulas (contornos da Latin Modern Math embutida).
feather-math = { path = "../feather-math" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# O idioma do sistema escolhe o da interface na primeira abertura.
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.42"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
# Ícone e nome do .exe do Windows (build.rs).
embed-resource = "3"
